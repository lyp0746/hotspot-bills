<text x="250" y="134" text-anchor="middle" font-size="18" fill="#2f6db0" font-weight="bold">知乎：持续发酵的公共焦虑</text>
<text x="84" y="180" text-anchor="start" font-size="14" fill="#1a1a1a" font-weight="normal">· 低成本爱好（122 天）</text>
