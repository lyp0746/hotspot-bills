<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="900" height="480" fill="#ffffff"/>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">“跟上”：事情变快的速度 ÷ 你回应的速度</text>
<text x="450" y="62" text-anchor="middle" font-size="14" fill="#666">τ = 需要的时间 ÷ 你有的时间；τ 越大，越只能说方向</text>
<text x="224" y="130" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">事件传播 / 情绪</text>
<rect x="240" y="100" width="84.0" height="46" rx="6" fill="#c62828" stroke="#c62828" stroke-width="1.4"/>
<text x="336.0" y="130" text-anchor="start" font-size="13" fill="#666" font-weight="normal">分钟 → 小时</text>
<text x="224" y="198" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">平台 / 市场</text>
<rect x="240" y="168" width="168.0" height="46" rx="6" fill="#ef6c00" stroke="#ef6c00" stroke-width="1.4"/>
<text x="420.0" y="198" text-anchor="start" font-size="13" fill="#666" font-weight="normal">小时 → 天</text>
<text x="224" y="266" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">机构回应</text>
<rect x="240" y="236" width="336.0" height="46" rx="6" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.4"/>
<text x="588.0" y="266" text-anchor="start" font-size="13" fill="#666" font-weight="normal">周 → 月</text>
<text x="224" y="334" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">调查 / 司法 / 政策</text>
<rect x="240" y="304" width="476.0" height="46" rx="6" fill="#2f6db0" stroke="#2f6db0" stroke-width="1.4"/>
<text x="728.0" y="334" text-anchor="start" font-size="13" fill="#666" font-weight="normal">月 → 年</text>
<text x="224" y="402" text-anchor="end" font-size="15" fill="#1a1a1a" font-weight="normal">气候 / 人口 / 产业</text>
<rect x="240" y="372" width="560.0" height="46" rx="6" fill="#8e5a9c" stroke="#8e5a9c" stroke-width="1.4"/>
<text x="812.0" y="402" text-anchor="start" font-size="13" fill="#666" font-weight="normal">十年 → 百年</text>
<text x="360" y="88" text-anchor="start" font-size="15" fill="#c62828" font-weight="bold">快钟</text>
<text x="710" y="88" text-anchor="start" font-size="15" fill="#2f6db0" font-weight="bold">慢钟</text>
<text x="450.0" y="458" text-anchor="middle" font-size="14" fill="#666" font-weight="normal">冲击常来自快钟，而回应落在慢钟——这就是错位。</text>
</svg>