<text x="873.0" y="445" text-anchor="middle" font-size="14" fill="#1a1a1a">还是它吗？</text>
<text x="480.0" y="536" text-anchor="middle" font-size="14" fill="#666" font-weight="normal">六个问题问完，一个热点就变成一张有结构的图。</text>
