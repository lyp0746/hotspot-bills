<h2>怎么用这本书</h2>

<p>这本书只有三章，但每一张诊断卡都可以独立使用。</p>

<table class="nat">
<tr><th class="l">你想做什么</th><th class="l">读哪里</th></tr>
<tr><td class="l">学会这套方法</td><td class="l">第一章（五把尺子 + 诊断卡模板）</td></tr>
<tr><td class="l">知道数据从哪来、怎么复现</td><td class="l">第二章 + 附录 C</td></tr>
<tr><td class="l">直接看案例</td><td class="l">第三章（12 张知乎卡 + 3 张 X 卡）</td></tr>
<tr><td class="l">自己诊断一个热点</td><td class="l">附录 A 的模板，照着填</td></tr>
</table>

<div class="box box-do"><p><b>【最简用法】</b>遇到任何热点，先只问两个问题：<b>（1）大家在争的是事实，还是诠释？（2）各方各自让出了哪一个顶点？</b>大多数时候，这两个问题就能让一场吵架从"谁对谁错"变成"我们到底在争什么"。</p></div>

<p>还有一个约定：本书每条判断都带<b>证据等级</b>（A/B/C）与<b>可反驳条件</b>。如果你用真实数据推翻了某张诊断卡——<b>那正是这套方法在起作用。</b></p>
